<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Skyline Institute</title>
    
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #28a745; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #c82333; }
        .dashboard-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 1100px; margin: 0 auto; position: relative; }
        
        /* Profile Grid Layout */
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .info-group { margin-bottom: 5px; }
        .info-group strong { display: inline-block; width: 140px; color: #555; }
        .highlight-status { color: #0056b3; font-weight: bold; font-size: 16px; }
        
        /* Marks Table Styles */
        .marks-container { margin-top: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 10px; white-space: nowrap; }
        th { background-color: #007bff; color: white; }
        .tech-header { text-align: left; font-weight: bold; background-color: #f8f9fa; color: #333; }

        .theory-text { color: #0056b3; font-size: 12px; }
        .practical-text { color: #28a745; font-size: 12px; }
        .grade-text { font-weight: bold; color: #dc3545; }

        .marksheet-section { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .download-btn { background: #28a745; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; font-size: 15px; cursor: pointer; border: none; }
        .download-btn:hover { background: #218838; }
        .digital-btn { background: #17a2b8; }
        .digital-btn:hover { background: #138496; }
        .no-marksheet { color: red; font-weight: bold; font-size: 14px; }

        /* PDF header jo sirf print karte time dikhega */
        #pdf-header { display: none; text-align: center; margin-bottom: 20px; }
        #pdf-header h1 { margin: 0; color: #0056b3; }
        #pdf-header p { margin: 5px 0 0 0; color: #555; }

        /* Responsive */
        @media (max-width: 768px) {
            .profile-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Welcome ✌️, <span id="studentName">Student</span></h2>
        <button class="logout-btn" onclick="logoutStudent()">Logout</button>
    </div>

    <!-- Is area ko hum PDF mein convert karenge -->
    <div class="dashboard-card" id="digitalMarksheetContent">
        
        <div id="pdf-header">
            <h1>Skyline Institute of Geo-Informatics</h1>
            <p>Digital Academic Scorecard</p>
            <hr style="border-top: 2px solid #007bff; margin-top:10px;">
        </div>

        <h3>Your Profile Details</h3>
        <div class="profile-grid">
            <div class="info-group"><strong>Roll No:</strong> <span id="rollNo">...</span></div>
            <div class="info-group"><strong>ID No:</strong> <span id="idNo">...</span></div>
            <div class="info-group"><strong>Course:</strong> <span id="courseName">...</span></div>
            <div class="info-group"><strong>Mobile:</strong> <span id="mobileNo">...</span></div>
            <div class="info-group"><strong>Batch Duration:</strong> <span id="duration">...</span></div>
            <div class="info-group"><strong>Placement Status:</strong> <span id="placementStatus" class="highlight-status">...</span></div>
        </div>

        <div class="marks-container">
            <h3>Academic Performance</h3>
            <table id="studentMarksTable">
                <tr><td>Loading Matrix...</td></tr>
            </table>
        </div>

        <div class="marksheet-section" id="marksheetSection">
            <p>Loading your result status...</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('studentToken');
        if (!token) window.location.href = '/student-login.html';

        function logoutStudent() {
            localStorage.removeItem('studentToken');
            window.location.href = '/student-login.html';
        }

        window.onload = async function() {
            try {
                const response = await fetch('/api/student/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const student = await response.json();

                if (response.ok) {
                    // Profile Data Mapping
                    document.getElementById('studentName').innerText = student.name;
                    document.getElementById('rollNo').innerText = student.rollNo;
                    document.getElementById('idNo').innerText = student.idNo || 'N/A';
                    document.getElementById('courseName').innerText = student.courseName || 'N/A';
                    document.getElementById('mobileNo').innerText = student.mobileNo || 'N/A';
                    document.getElementById('duration').innerText = `${student.startDate || '-'} to ${student.endDate || '-'}`;
                    document.getElementById('placementStatus').innerText = student.placementStatus || 'Pending';

                    // Dynamic Table Generation based on enrolledTechs
                    const defaultTechs = ['gis', 'rs', 'lidar', 'pht', 'drone', 'gps', 'webgis', 'geoai', 'python'];
                    const activeTechs = (student.enrolledTechs && student.enrolledTechs.length > 0) ? student.enrolledTechs : defaultTechs;
                    
                    let tableHTML = `
                        <thead>
                            <tr>
                                <th style="text-align: left;">Technology</th>
                                <th>Mid-Term (T|P)</th>
                                <th>Final Exam (T|P)</th>
                                <th>Viva</th>
                                <th>Attendance</th>
                                <th>Reports/Assignment</th>
                                <th>Final Result</th>
                                <th>Grade</th>
                            </tr>
                        </thead>
                        <tbody>
                    `;

                    // Generate rows for each active technology
                    activeTechs.forEach(tech => {
                        let marks = { midTermT: 0, midTermP: 0, finalT: 0, finalP: 0, viva: 0, attendance: 0, reports: 0, finalResult: 0, grade: "-" };
                        
                        if (student.marks) {
                            let markObj = null;
                            if (student.marks instanceof Map || typeof student.marks.get === 'function') {
                                markObj = student.marks.get(tech);
                            } else {
                                markObj = student.marks[tech];
                            }
                            if (markObj) marks = { ...marks, ...markObj };
                        }

                        tableHTML += `
                            <tr>
                                <td class="tech-header">${tech.toUpperCase()}</td>
                                <td><span class="theory-text">${marks.midTermT} (T)</span> | <span class="practical-text">${marks.midTermP} (P)</span></td>
                                <td><span class="theory-text">${marks.finalT} (T)</span> | <span class="practical-text">${marks.finalP} (P)</span></td>
                                <td><strong>${marks.viva}</strong></td>
                                <td><strong>${marks.attendance}</strong></td>
                                <td><strong>${marks.reports}</strong></td>
                                <td><strong style="color:#007bff;">${marks.finalResult}</strong></td>
                                <td class="grade-text">${marks.grade || '-'}</td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += `</tbody>`;
                    document.getElementById('studentMarksTable').innerHTML = tableHTML;

                    // UI injection for Both Download Buttons
                    const marksheetSec = document.getElementById('marksheetSection');
                    let buttonsHTML = `<h3>Your Final Result Marksheet</h3><div style="margin: 15px 0; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; align-items: center;">`;

                    if (student.marksheetUrl) {
                        buttonsHTML += `<a href="${student.marksheetUrl}" target="_blank" download class="download-btn">📥 Download Manual Marksheet</a>`;
                    } else {
                        buttonsHTML += `<span class="no-marksheet">Manual Marksheet Not Uploaded</span>`;
                    }

                    // Digital Marksheet button hamesha available rahega
                    buttonsHTML += `<button onclick="generateDigitalMarksheet()" class="download-btn digital-btn">🖥️ Download Digital Marksheet</button>`;
                    buttonsHTML += `</div>`;
                    
                    marksheetSec.innerHTML = buttonsHTML;

                } else {
                    alert(student.error || "Session expired.");
                    logoutStudent();
                }
            } catch (error) {
                alert("Error loading profile.");
            }
        };

        // PDF Generation Logic
        async function generateDigitalMarksheet() {
            const { jsPDF } = window.jspdf;
            const captureArea = document.getElementById('digitalMarksheetContent');
            const buttonsSection = document.getElementById('marksheetSection');
            const pdfHeader = document.getElementById('pdf-header');

            // Download buttons ko PDF se hide karna aur title dikhana
            buttonsSection.style.display = 'none';
            pdfHeader.style.display = 'block';

            try {
                const canvas = await html2canvas(captureArea, { scale: 2, useCORS: true });
                const imgData = canvas.toDataURL('image/png');
                
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const imgProps = pdf.getImageProperties(imgData);
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

                // Image ko top thoda margin dekar add karna
                pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, pdfHeight);
                
                // Roll No. ke hisab se file ka naam set karna
                const rollNo = document.getElementById('rollNo').innerText || 'Student';
                pdf.save(`Digital_Marksheet_${rollNo}.pdf`);

            } catch (error) {
                console.error("PDF generation failed", error);
                alert("Failed to generate Digital Marksheet. Try again.");
            } finally {
                // UI wapas normal karna
                buttonsSection.style.display = 'block';
                pdfHeader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
